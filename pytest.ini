[pytest]
# Only files named test_*.py are tests.
#
# Without this, pytest's default also collects *_test.py, which picked up
# vision_test.py, voice_test.py, ab_test.py and rate_test.py. Those are
# scripts with top-level code, not tests: importing vision_test.py opened
# the webcam, called the Gemini API and spoke aloud on every pytest run.
# That is why the suite took 46-77 seconds instead of under one.
python_files = test_*.py
norecursedirs = docs writeups .venv .git __pycache__
